<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robot Room Mapper</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #111; color: #eee; }
    button { font-size: 16px; padding: 10px 12px; margin: 3px; border-radius: 8px; border: 0; background: #2a7; color: #fff; cursor: pointer; }
    button.red { background: #c44; }
    button.blue { background: #27c; }
    button.on { background: #e90; }
    input { font-size: 16px; padding: 8px; border-radius: 8px; border: 0; width: 50%; }
    canvas { width: 100%; background: #1d1d1d; border-radius: 8px; touch-action: none; }
    #status { font-size: 15px; margin: 6px 0; min-height: 1.4em; color: #9df; }
    .room { display: flex; justify-content: space-between; align-items: center; background: #222; border-radius: 8px; padding: 6px 10px; margin: 4px 0; }
    .room-btns { display: flex; gap: 4px; }
  </style>
</head>
<body>
  <div id="status">Step 1: Calibrate speed.</div>
  <canvas id="c" width="640" height="640"></canvas>
  <div>
    <button id="bCal">Calibrate speed</button>
    <button id="bStart">Start trace</button>
    <button id="bStop" class="red">Stop trace</button>
    <button id="bCorner">Corner mode: off</button>
  </div>
  <div>
    <input id="name" placeholder="Room name">
    <button id="bSave">Save room</button>
    <button id="bClear" class="red">Clear</button>
  </div>
  <h3>Saved rooms</h3>
  <div id="rooms"></div>

  <script>
    // Phone sits flat on the robot, top edge pointing forward.
    // Lowered MOVE_THRESH to 0.08 so smooth cruising on flat floors still counts as moving.
    const MOVE_THRESH = 0.08;
    const KEY = 'robotRoomMapper.rooms';

    const S = {
      speed: null,        // feet per second, from calibration
      tracing: false,
      pts: [],            // traced path, feet
      corners: [],        // user-tapped corners, feet
      cur: { x: 0, y: 0 },
      h: null,            // current compass heading, degrees
      gyroAngle: 0,       // integrated gyroscope heading, degrees
      hasGyro: false,
      h0: null,           // heading when trace started
      moving: false,
      acc: [],
      last: 0
    };

    let cornerMode = false;
    let wakeLock = null;
    let rooms = [];
    try { rooms = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { rooms = []; }

    const c = document.getElementById('c');
    const g = c.getContext('2d');
    const st = document.getElementById('status');
    const say = t => st.textContent = t;

    // ---------- wake lock recovery ----------
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && S.tracing) {
        requestWakeLock();
      }
    });

    function onOrient(e) {
      let h = null;
      if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
      else if (e.alpha != null) h = (360 - e.alpha + 360) % 360;
      if (h != null) S.h = h;
    }
    window.addEventListener('deviceorientationabsolute', onOrient);
